[env:freenove_esp32_s3_camera]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; Conservative 8 MB flash layout, OPI PSRAM (Freenove S3 camera board).
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 460800
; Select the S3 USB-to-UART port when uploading; never hard-code Things' COM7.
