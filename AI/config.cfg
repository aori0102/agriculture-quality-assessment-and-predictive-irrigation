[edge]
edge_id = c995b729-888e-4a09-a5c3-77d86efa652c

[mqtt]
host = mqtt-dashboard.com
port = 1883
topic_prefix = iot
telemetry_filter = iot/{edge_id}/+/telemetry
image_filter = iot/{edge_id}/+/image
status_filter = iot/{edge_id}/+/status
command_topic = iot/{edge_id}/{node_id}/command
event_filter = iot/{edge_id}/+/events
command_qos = 1
event_qos = 1
command_retain = false

[pump]
max_duration_ms = 599999
command_ttl_ms = 10000
start_ack_timeout_ms = 2000
max_attempts = 3

[nodes]
acquired_nodes_path = node_history.json
default_node_profile = {"node_id": "default", "plant": "default", "pwp": 10.0, "madp": 20.0, "fc": 36.0, "sp": 50.0}

[retrain]
debug_hourly = true

[irrigation]
irrigation_sampling = [0.1, 0.2, 0.3, 0.4]

[irrigation_sampling]
sample_delay_seconds = 1

[irrigation_model]
model_path = IrrigationPrediction/models/irrigation_5c6b2bf66c99498aafdc5b8567c89654.joblib

[vision_model]
classifier_path = ComputerVision/runs/classify/lettuce-npk-x/weights/best.pt
detection_path = ComputerVision/runs/detect/lettuce-pallets-x/weights/best.pt

[vision_output]
output_dir = ComputerVision/output

