[edge]
edge_id = c995b729-888e-4a09-a5c3-77d86efa652c

[mqtt]
host = mqtt-dashboard.com
port = 1883
topic_prefix = iot
telemetry_filter = iot/{edge_id}/+/telemetry
status_filter = iot/{edge_id}/+/status
command_topic = iot/{edge_id}/{node_id}/commands
event_filter = iot/{edge_id}/+/events
command_qos = 1
event_qos = 1
command_retain = false

[pump]
max_duration_ms = 5000
command_ttl_ms = 10000
start_ack_timeout_ms = 2000
max_attempts = 3

